---
- name: Kumpulkan Laporan VM Proxmox Menggunakan Script Custom
  hosts: all
  gather_facts: false
  tasks:

    - name: Salin dan jalankan script vm-list.sh di setiap node Proxmox
      script: vm-list.sh
      register: script_output
      changed_when: false

    - name: Tampilkan Header CSV
      run_once: true
      debug:
        msg: "NODE_PROXMOX,VMID,Name,vCPU,RAM(MB),TotalDisk(GB)"

    - name: Tampilkan Hasil Data VM
      vars:
        # Menghapus baris header pertama bawaan script agar tidak double
        lines: "{{ script_output.stdout_lines[1:] if script_output.stdout_lines | length > 1 else [] }}"
      debug:
        msg: "{{ inventory_hostname }},{{ item }}"
      loop: "{{ lines }}"
      when: lines | length > 0