---
- name: Kumpulkan Laporan VM dari Semua Node Proxmox
  hosts: all
  gather_facts: false
  tasks:

    - name: Scan data VM di node Proxmox
      shell: |
        qm list | awk 'NR>1 {print $1 "," $3}' | while IFS=, read -r vmid status; do
            name=$(qm config $vmid | grep "^name:" | awk '{print $2}')
            [ -z "$name" ] && name="No-Name"

            cores=$(qm config $vmid | grep "^cores:" | awk '{print $2}')
            [ -z "$cores" ] && cores=$(qm config $vmid | grep "^sockets:" | awk '{print $2}')
            [ -z "$cores" ] && cores="1"

            ram_mb=$(qm config $vmid | grep "^memory:" | awk '{print $2}')
            [ -z "$ram_mb" ] && ram_mb="0"
            ram_gb=$(echo "scale=1; $ram_mb / 1024" | bc)

            storage_size=$(qm config $vmid | egrep -i '(scsi|sata|virtio|ide)[0-9]:' | grep -o 'size=[^,]*' | cut -d= -f2 | tr '\n' ' ' | sed 's/ $//')
            [ -z "$storage_size" ] && storage_size="N/A"

            mac_address=$(qm config $vmid | grep -E "^net[0-9]:" | grep -oE "([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}" | tr '\n' ',' | sed 's/,$//')
            [ -z "$mac_address" ] && mac_address="No-NIC"

            echo "{{ inventory_hostname }},$vmid,$name,$status,${cores} Core,${ram_gb} GB,$storage_size,$mac_address"
        done
      register: qm_output
      changed_when: false

    - name: Tampilkan Header CSV
      run_once: true
      debug:
        msg: "NODE_PROXMOX,VMID,NAMA_VM,STATUS,CPU,RAM,STORAGE,MAC_ADDRESS"

    - name: Tampilkan Hasil Data VM di Console Output AWX
      debug:
        var: qm_output.stdout_lines
      when: qm_output.stdout_lines is defined and qm_output.stdout_lines | length > 0