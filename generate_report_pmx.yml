---
- name: Eksekusi Laporan VM di Node Proxmox
  hosts: all
  gather_facts: false
  tasks:

    - name: 1. Copy file vm-list.sh ke node Proxmox
      copy:
        src: vm-list.sh
        dest: /tmp/vm-list.sh
        mode: '0755'

    - name: 2. Jalankan script di node dan simpan ke vm-list.csv
      shell: /tmp/vm-list.sh > /tmp/vm-list.csv
      changed_when: false

    - name: 3. Cat vm-list.csv agar muncul di output AWX
      command: cat /tmp/vm-list.csv
      register: csv_output
      changed_when: false

    - name: Tampilkan Hasil CSV di Log AWX
      debug:
        msg: "{{ csv_output.stdout_lines }}"